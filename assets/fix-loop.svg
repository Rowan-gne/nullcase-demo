<text x="28" y="44" font-size="24" class="b" text-anchor="start">nullcase-demo</text>
<text x="28" y="68" font-size="14" class="muted" text-anchor="start">From a flaky CI failure to a verified fix, by experiment.</text>
<g class="a1"><rect x="20" y="92" width="268" height="132" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.7"/><circle cx="45" cy="118" r="11" fill="#f43f5e"/><text x="45" y="122.5" font-size="12" class="b" text-anchor="middle" style="fill:#0f172a">1</text><text x="64" y="123" font-size="14" class="b" text-anchor="start">CI fails, sometimes</text><text x="36" y="154" font-size="12.5" class="muted" text-anchor="start">CI shuffles test order, and</text><text x="36" y="174" font-size="11.5" class="mono" text-anchor="start" style="fill:#fbbf24">test_first_user_gets_id_1</text><text x="36" y="194" font-size="12.5" class="muted" text-anchor="start">fails when another test runs first.</text></g>
<g class="a2"><rect x="306" y="92" width="268" height="132" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.7"/><circle cx="331" cy="118" r="11" fill="#fbbf24"/><text x="331" y="122.5" font-size="12" class="b" text-anchor="middle" style="fill:#0f172a">2</text><text x="350" y="123" font-size="14" class="b" text-anchor="start">Diagnosed by experiment</text><text x="322" y="154" font-size="12.5" class="muted" text-anchor="start">baseline 0/20 · order 13/20</text><text x="322" y="174" font-size="12.5" class="muted" text-anchor="start">→ order_dependent</text><text x="322" y="194" font-size="12.5" class="muted" text-anchor="start">repro confirmed, 3 of 3 replays</text></g>
<g class="a3"><rect x="592" y="92" width="268" height="132" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.7"/><circle cx="617" cy="118" r="11" fill="#38bdf8"/><text x="617" y="122.5" font-size="12" class="b" text-anchor="middle" style="fill:#0f172a">3</text><text x="636" y="123" font-size="14" class="b" text-anchor="start">Fix proposed</text><text x="608" y="154" font-size="12.5" class="muted" text-anchor="start">An AI model reads the diagnosis</text><text x="608" y="174" font-size="12.5" class="muted" text-anchor="start">and the relevant code, and</text><text x="608" y="194" font-size="12.5" class="muted" text-anchor="start">proposes a patch.</text></g>
<g class="a4"><rect x="20" y="256" width="268" height="132" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.7"/><circle cx="45" cy="282" r="11" fill="#38bdf8"/><text x="45" y="286.5" font-size="12" class="b" text-anchor="middle" style="fill:#0f172a">4</text><text x="64" y="287" font-size="14" class="b" text-anchor="start">Checked before running</text><text x="36" y="318" font-size="12.5" class="muted" text-anchor="start">Rejected if it skips the test,</text><text x="36" y="338" font-size="12.5" class="muted" text-anchor="start">weakens its assertions or</text><text x="36" y="358" font-size="12.5" class="muted" text-anchor="start">switches off the experiment.</text></g>
<g class="a5"><rect x="306" y="256" width="268" height="132" rx="12" fill="#1e293b" stroke="#22c55e" stroke-opacity="0.7"/><circle cx="331" cy="282" r="11" fill="#22c55e"/><text x="331" y="286.5" font-size="12" class="b" text-anchor="middle" style="fill:#0f172a">5</text><text x="350" y="287" font-size="14" class="b" text-anchor="start">Verified the same way</text><text x="322" y="318" font-size="12.5" class="muted" text-anchor="start">The same seeds re-run on the patch;</text><text x="322" y="338" font-size="12.5" class="muted" text-anchor="start">accepted only at 0 failures and</text><text x="322" y="358" font-size="12.5" class="muted" text-anchor="start">no new failures in the suite.</text></g>
<g class="a6"><rect x="592" y="256" width="268" height="132" rx="12" fill="#1e293b" stroke="#22c55e" stroke-opacity="0.7"/><circle cx="617" cy="282" r="11" fill="#22c55e"/><text x="617" y="286.5" font-size="12" class="b" text-anchor="middle" style="fill:#0f172a">6</text><text x="636" y="287" font-size="14" class="b" text-anchor="start">Pull request with evidence</text><text x="608" y="318" font-size="12.5" class="muted" text-anchor="start">The before/after table goes in</text><text x="608" y="338" font-size="12.5" class="muted" text-anchor="start">the PR, which is merged only</text><text x="608" y="358" font-size="12.5" class="muted" text-anchor="start">if CI passes.</text></g>
