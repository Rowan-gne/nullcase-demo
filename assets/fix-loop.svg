<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="title desc">
<title id="title">From a flaky CI failure to a verified fix</title>
<desc id="desc">CI fails because test order is shuffled. NullCase diagnoses it by experiment: order fails 13 of 20 runs against 0 of 20 in the pinned baseline, so it's order-dependent. An AI model proposes a patch. It's rejected if it skips the test, weakens assertions or switches off the experiment. The same experiments are re-run on the patched code and it's accepted only at zero failures with no new failures in the suite. A pull request then carries the before and after evidence.</desc>
